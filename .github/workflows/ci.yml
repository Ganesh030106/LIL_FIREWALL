name: Volcano AI Firewall CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (libpcap for Scapy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: ruff check backend

      - name: Run Mypy Typecheck
        run: mypy backend

      - name: Run Pytest Test Suite
        run: pytest backend/tests -v

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Build Frontend Distribution
        run: npm run build
      # Note: npm test skipped as no test script is defined in package.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: volcano-ai-firewall:latest

  security:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Security Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit on backend dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Run npm audit (high/critical) on frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  postgres-migrations:
    name: PostgreSQL 16 Alembic Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volcano_ci
          POSTGRES_PASSWORD: volcano_ci_secret
          POSTGRES_DB: volcano_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations against PostgreSQL 16
        env:
          DATABASE_URL: postgresql://volcano_ci:volcano_ci_secret@localhost:5432/volcano_ci_test
          VOLCANO_PROFILE: production
        run: |
          cd backend
          alembic upgrade head

  helm:
    name: Helm Chart Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm Lint Chart
        run: |
          helm lint deploy/helm/volcano -f deploy/helm/volcano/values.yaml
          helm lint deploy/helm/volcano -f deploy/helm/volcano/values-dev.yaml

      - name: Helm Template (Production)
        run: |
          helm template volcano deploy/helm/volcano -f deploy/helm/volcano/values.yaml

      - name: Helm Template (Development)
        run: |
          helm template volcano deploy/helm/volcano -f deploy/helm/volcano/values-dev.yaml


