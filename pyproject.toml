[project]
name = "ai-powered-contextual-firewall-for-traffic-anomaly-detection"
version = "3.0.0"
description = "AI-Powered Contextual Firewall for Traffic Anomaly Detection"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Conservative rule selection: Pyflakes (F) and Pycodestyle Errors (E)
select = ["F", "E"]
ignore = [
    "E501",  # Line length
    "E402",  # Module level import not at top of file
    "E722",  # Bare except
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:scapy.*",
    "ignore::cryptography.utils.CryptographyDeprecationWarning",
]
